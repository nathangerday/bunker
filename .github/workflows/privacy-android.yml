name: Privacy Android validation

on:
  push:
    branches: [privacy/disable-telemetry]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build dependencies
        run: |
          python -m pip install pycryptodome==3.21.0 msgpack==1.1.1 lz4==4.3.2
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" >/dev/null
      - name: Test privacy and packaging logic
        run: |
          (cd scripts && python -m unittest test_emulator_network test_version test_release_assets test_notices)
          (cd android/tools && python -m unittest test_privacy test_build_info test_notice_pack)
          (cd web && python -m unittest test_build_site)
      - name: Prepare pinned sources
        run: |
          python scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
      - name: Build Android launcher
        run: |
          android/tools/build_native.sh
          cd android
          ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload launcher only (no game files or signing secrets)
        uses: actions/upload-artifact@v4
        with:
          name: privacy-android-launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
